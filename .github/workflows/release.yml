# Builds packages on every push. A tag vX.Y.Z also publishes them as a GitHub
# release; the tag must match the version at the top of debian/changelog.
#
# amd64 only: winslot runs x86_64 Windows guests under KVM (domain arch x86_64,
# vmx/svm, Windows x64 image and drivers), so an arm64 package could not work.
name: packages

on:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            distro: ubuntu24.04
          - image: ubuntu:26.04
            distro: ubuntu26.04
          - image: debian:13
            distro: debian13
    container: ${{ matrix.image }}
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential debhelper golang-1.24-go ca-certificates
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check the tag matches the changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(dpkg-parsechangelog -S Version)"
      - name: Build
        run: dpkg-buildpackage -b -us -uc
      - name: Name the package for its distribution
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          mkdir dist
          version=$(dpkg-parsechangelog -S Version)
          mv "../winslot_${version}_amd64.deb" "dist/winslot_${version}_${DISTRO}_amd64.deb"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.distro }}
          path: dist/*
          if-no-files-found: error

  arch:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel git go
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build
        # makepkg refuses to run as root. --nodeps: only the build needs to
        # work here, and the runtime dependencies are large.
        run: |
          useradd -m builder
          chown -R builder .
          cd packaging/arch
          su builder -c 'makepkg --nodeps --noconfirm'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arch
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --generate-notes *
