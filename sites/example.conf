# Example site. Copy to sites/<site>.conf, with the admin keys in
# sites/<site>.admin-keys. Real site files stay out of git. Read by
# `make installer SITE=<site>` and by install/bootstrap on the server's first
# boot. Plain shell assignments.

HOSTNAME=vmhost
ADMIN_USER=vmadmin                         # role account; keys in sites/<site>.admin-keys (also every VM's admin keys)
TIMEZONE=America/New_York
WINDOWS_TIMEZONE="Eastern Standard Time"   # the same zone, as a Windows time zone ID (for VMs)

# Uplink: static address plus DHCP as a fallback on the same NIC.
NIC=eno1
SERIAL=ttyS1                            # serial console (Supermicro SOL is usually COM2 = ttyS1)
ADDRESS=192.0.2.10/24
GATEWAY=192.0.2.1
DNS=192.0.2.1

# VM network: routed (no NAT), advertised into OSPF.
VM_NET_ADDRESS=10.0.3.1
VM_NET_PREFIX=24
VM_DHCP_START=10.0.3.100
VM_DHCP_END=10.0.3.254
ZONE=vms.example.org
OSPF_AREA=0

# Optional: DHCP for the uplink LAN and DNS for its devices. Leave LAN_DHCP_START
# out if the router keeps doing it. The pool must not overlap the router's.
# Reservations and names of static devices go in sites/<site>.lan-hosts and
# sites/<site>.lan-records. Authoritative only once the reservations are complete:
# it NAKs any address it doesn't know (see RUNBOOK).
LAN_ZONE=lan.vms.example.org
LAN_DHCP_START=192.0.2.120
LAN_DHCP_END=192.0.2.149
LAN_DHCP_AUTHORITATIVE=no
LAN_DNS_UPSTREAM="192.0.2.1"            # space-separated; this server answers everything clients ask
PEER_ZONES=""                           # other sites, space-separated: zone=address
